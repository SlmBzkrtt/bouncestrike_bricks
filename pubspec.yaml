name: bouncestrike_bricks
description: A physics-based brick breaker game with 5 unique visual themes built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

# Google Play & App Store Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0E1A"
  image_path: "assets/icon/app_icon.png"

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#0B0E1A"
  android_12:
    color: "#0B0E1A"
  fullscreen: true
